name: CI

# CLAUDE.md §6: everything `make ci` covers, on every push. Vivado and the board stay local; their reports are
# committed with the RTL that produced them.

on:
  push:
  pull_request:

env:
  # cocotb 2.x needs Verilator >= 5.036, newer than any apt package: built from source, cached on this key.
  # Keep equal to docs/toolchain.md.
  VERILATOR_VERSION: v5.050

jobs:
  ci:
    runs-on: ubuntu-24.04
    # The same distribution as the development machine (docs/toolchain.md: WSL Ubuntu 26.04), so clang-tidy 21,
    # cppcheck 2.19, CMake and Python 3.14 match the versions the code was checked with locally.
    container: ubuntu:26.04
    steps:
      - name: Install system packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make python3 python3-venv python3-dev g++ cmake \
            clang clang-tidy clang-format cppcheck libclang-rt-dev \
            autoconf bison flex help2man libfl-dev perl zlib1g-dev zstd

      - uses: actions/checkout@v7
        with:
          submodules: true  # rtl/eth: fpga-eth-core at its release tag

      # The container runs as root over a checkout owned by another uid; git refuses it without this.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v6
        with:
          path: ~/verilator-install
          key: verilator-ubuntu-26.04-${{ env.VERILATOR_VERSION }}

      - name: Build Verilator
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VERILATOR_VERSION" https://github.com/verilator/verilator.git /tmp/verilator
          cd /tmp/verilator
          autoconf
          ./configure --prefix="$HOME/verilator-install"
          make -j"$(nproc)"
          make install

      - name: Put Verilator on PATH
        run: echo "$HOME/verilator-install/bin" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: |
          verilator --version
          python3 --version
          cmake --version | head -1
          clang-tidy --version | head -2
          cppcheck --version

      - name: Set up Python environment
        run: make setup

      # ruff, mypy, Verilator lint, model tests, cocotb, ground station (GoogleTest, loopback), C++ static analysis,
      # 30 s of libFuzzer per target.
      - name: make ci
        run: make ci

      # A fuzzer crash: keep the input that triggered it (Makefile `fuzz`: fix, then commit it as a seed).
      - name: Upload fuzzer crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: build/fuzz/crash-*
          if-no-files-found: ignore
